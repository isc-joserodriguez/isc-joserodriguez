name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dots use the contribution heat scale of the profile panels (navy → blue → violet → cyan).
      - name: Generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: isc-joserodriguez
          outputs: |
            dist/github-snake.svg?color_snake=#2563eb&color_dots=#e2e8f0,#bfdbfe,#60a5fa,#a78bfa,#06b6d4
            dist/github-snake-dark.svg?color_snake=#00dcf5&color_dots=#0f1a2e,#1d3a74,#3567c9,#a85dee,#00dcf5

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
